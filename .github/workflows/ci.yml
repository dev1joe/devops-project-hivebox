name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
# Scorecard's "Token-Permissions" check looks for this.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 #  match your Dockerfile's base image
          cache: npm # caches ~/.npm keyed on package-lock.json

      - run: npm ci # exact install from lockfile
      - run: npm run lint
      - run: npm test # must be `vitest run`, not watch mode

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test # only build if lint/tests pass
    steps:
      - uses: actions/checkout@v4

      # 3.4: lint the Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # 3.4: build the image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # makes the image available to `docker run` below
          tags: hivebox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3.5: run it and check /version
      - name: Run container
        run: docker run -d --name hivebox -p 3000:3000 hivebox:ci

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' hivebox)"
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "Container never became healthy"
          exit 1

      - name: Check /api/version
        run: |
          expected="$(jq -r .version package.json)"
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors http://localhost:3000/api/version)"
          echo "response=$response"
          actual="$(echo "$response" | jq -r .version)"
          echo "expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "Error: Version mismatch! expected '$expected', got '$actual'."
            exit 1
          fi

      - name: Debug container
        if: always()
        run: |
          docker ps -a
          echo "--- logs ---"
          docker logs hivebox
          echo "--- probe ---"
          curl -v http://localhost:3000/api/version || true       run: docker logs hivebox
